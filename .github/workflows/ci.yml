name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile-app:
    name: Mobile app
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: accountability-app
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          sparse-checkout: accountability-app
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: accountability-app/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npx tsc --noEmit
      - name: Test
        run: npm test -- --runInBand
      - name: Check update budget
        run: npm run test:update-budget
      - name: Verify migration audit core
        run: node --test scripts/migration-audit/core.test.mjs

  admin-site:
    name: Admin site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: accountability-app/admin-site
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          sparse-checkout: accountability-app
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: accountability-app/admin-site/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npx tsc --noEmit
      - name: Build and test
        run: npm test

  share-site:
    name: Public share site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: accountability-app/share-site
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          sparse-checkout: accountability-app
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: accountability-app/share-site/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npx tsc --noEmit
      - name: Build and test
        run: npm test
